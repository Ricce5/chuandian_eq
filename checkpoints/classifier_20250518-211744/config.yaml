# 模型设置
model: Classifier
dataset: CD2021
# 训练参数

batch_size: 16
warmup_ratio: 0.18
learning_rate: 5e-4
weight_decay: 1e-5
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: hf_cosine  

# transfomer结构参数
d_model: 64
d_rnn: 64
d_inner: 64
n_layers: 2
n_head: 8
d_k: 16
d_v: 16
t_dropout: 0.4

# MLP 参数
mlp_out: 1
mlp_dropout: 0.3
mlp_hdw: [256, 128, 64]

# 其他参数
dim: 3
epochs: 200
save_dir: null
cuda_id: "1"

# 数据与控制参数
Mc: 5.5
Mf: 6.0
Twindow: 200
Tfore: 20
dt: 10
context_len: 1
split_by_time: true
