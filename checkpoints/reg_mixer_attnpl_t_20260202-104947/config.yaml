# resume_path: ./checkpoints/mixer_tpp_20260126-175212/last_model_1.pth
# load_specific_parts: ['encoder']
model: reg_mixer_attnpl_t
# 训练参数

use_ema: false
batch_size: 64
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3  #6e-4 # 5e-4
weight_decay: 1e-2
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.5

d_model: 64
mixer_model_config:
  input_dim: 1
  dropout_prob: 0.1
  d_model: 64
  n_layer: 1        
  d_intermediate: 128       # 通常为 d_model 的 4 倍，设置为 0 可禁用 MLP
  # 输入投影层配置：linear 或 mlp
  input_proj_type: mlp
  input_proj_hidden: 128     # MLP隐藏层维度，未设置则默认 max(d_model, input_dim)
  input_proj_activation: silu  # 可选: gelu | relu | silu
  input_proj_dropout: 0.1
  # 输入层初始化方式：default | xavier_uniform | xavier_normal | kaiming_uniform | kaiming_normal | normal | uniform
  input_init:  kaiming_uniform
  input_init_scale: 1.5
  attn_layer_idx: []
  ssm_cfg:
      layer: Mamba2Rotary   # 必须存在，用于选择使用 Mamba1
      d_conv: 4
      use_conv: true
      rotary_emb_scale_base: 1024

  attn_cfg:
    layer: MHATime
    num_heads: 4
    # d_conv: 4
    rotary_emb_dim: 8   # 一般为 d_model // num_heads // 2
    rotary_emb_scale_base: 1024
    causal: true

  norm_epsilon: 1e-5
  rms_norm: false            # 是否使用 RMSNorm 替代 LayerNorm

  initializer_cfg:
    initializer_range: 0.01  # 初始权重方差，保持默认即可

  fused_add_norm: false      # 是否使用 Triton 融合Norm（需支持）

  residual_in_fp32: true     # 更稳定的残差精度

extractor_name: attn_time_biased_mh
time_bias_type: log
agg: concat
extractor_cfg:
  fuse_mode: concat
  use_ln: true
  use_var_scale: true

# MLP 参数
mlp_out: 1
mlp_dropout: 0.3
mlp_hdw: [128]

# 其他参数
dim: 1
epochs: 150
save_epochs: [60,80,100,120,140]
save_dir: null
cuda_id: "0"

# 数据与控制参数
dataset: ChuanDian
criterion_name: smooth_l1
criterion_cfg:
   beta: 0.2
seed: 0
Mc: 3 # 4.5
Mf: 3
Twindow: 360
Tfore: 180
dt: 10
context_len: 1
split_by_time: true
features_input_keys : ['mag'] #  'log_inter_times'
normalize_time_by_token: true 
time_scale_base_key: tau_mean
task_type: regression
