# resume_path: /root/autodl-tmp/chuandian_eq/checkpoints/classifier_20250603-142623/last_model_1.pth
# 模型设置
model: thp_type
dataset: taxi
num_event_types: 10
pad_token_id: 10
task_type: tpp
# 训练参数

batch_size: 32
warmup_ratio: 0.1
learning_rate: 5e-4 # 5e-4
weight_decay: 1e-5
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.5

# transfomer结构参数
d_model: 64
d_rnn: 64
d_inner: 64
n_layers: 1
n_head: 8
d_k: 16
d_v: 16
t_dropout: 0.1
rnn_dropout: 0.01
attn_type: flash
# MLP 参数
mlp_out: 1
mlp_dropout: 0.3
mlp_hdw: [256, 128, 64]

# 其他参数
dim: 3
epochs: 150
save_dir: null
cuda_id: "0"

# 数据与控制参数
Mc: 3 # 4.5
Twindow: 200
dt: 10
split_by_time: true
use_sampler: true # true
time_order:  [train, val, test]
