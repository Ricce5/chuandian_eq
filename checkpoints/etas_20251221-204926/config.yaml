model: etas
num_event_types: 1
pad_token_id: 1
task_type: tpp
# 训练参数

bg_model: mamba
bg_model_cfg:
 d_feature: 1 
 d_state: 64
 d_model: 16
 model_type: mamba  # mamba | mamba2
 scale_init: 400.0

batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 5e-2 # 5e-4
weight_decay: 1e-5
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: none
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8

# 


# 其他参数
dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"


# 数据与控制参数
dataset: PNR_1z
seed: 0
minibatch_training: false
split_by_time: true
time_order:  [train, val, test]