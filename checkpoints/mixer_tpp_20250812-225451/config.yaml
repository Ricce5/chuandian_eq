# 模型设置
model: mixer_tpp
num_event_types: 1
pad_token_id: 1
task_type: tpp
# 训练参数

batch_size: 32
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3 # 5e-4
weight_decay: 1e-5
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: none
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8

d_model: 32
dropout: 0.3
mixer_model_config:
  input_dim: 2
  dropout_prob: 0.1
  d_model: 32
  n_layer: 1                 # 可根据实验设为 2~6
  d_intermediate: 64        # 通常为 d_model 的 4 倍，设置为 0 可禁用 MLP
  attn_layer_idx: []
  ssm_cfg:
      layer: MambaTime               # 必须存在，用于选择使用 Mamba1

  attn_cfg:
    layer: MHATime
    num_heads: 4
    rotary_emb_dim: 4   # 一般为 d_model // num_heads // 2
    rotary_emb_scale_base: 1024
    rotary_emb_time_center: 3200
    causal: true

  norm_epsilon: 1e-5
  rms_norm: false            # 是否使用 RMSNorm 替代 LayerNorm

  initializer_cfg:
    initializer_range: 0.02  # 初始权重方差，保持默认即可

  fused_add_norm: false      # 是否使用 Triton 融合Norm（需支持）

  residual_in_fp32: true     # 更稳定的残差精度


# 
num_components: 32

# 其他参数
dim: 1
epochs: 500
save_dir: null
cuda_id: "0"


# 数据与控制参数
dataset: SCEDC
seed: 0
minibatch_training: true
split_by_time: true
time_order:  [train, val, test]
features_input_keys : ['mag','log_inter_times'] #  