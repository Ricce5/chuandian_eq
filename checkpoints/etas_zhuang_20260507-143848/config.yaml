model: etas_zhuang
num_event_types: 1
pad_token_id: 1
task_type: tpp
# 训练参数





bg_learning_rate: 5e-4

fix_mu: false
richter_b: null

base_rate_init: 0.26
productivity_K_init: 0.11
productivity_alpha_e_init: 2.302585092994046

# ETASZhuang memory/constraint controls
etas_query_chunk_size: 0
etas_history_chunk_size: 9192
etas_grad_checkpoint: true
etas_enforce_subcritical: true
etas_max_branching_ratio: 0.98
etas_enforce_p_gt_one: true
etas_min_omori_p: 1.001
etas_constraint_softness: 1e-3

batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-2 # 5e-4
weight_decay: 5e-3
loss_reduction: per_time
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type:  step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8
# 


# 其他参数
dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"


# 数据与控制参数
dataset: ChuanDian
seed: 0
minibatch_training: false
split_by_time: true
time_order:  [train, val, test]
