# resume_path: ./checkpoints/mixer_tpp_20250821-223034/best_model_1.pth
# load_specific_parts: ['encoder']
model: clf_mixer_attnpl_t
# 训练参数
use_ema: false
batch_size: 128
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3  #6e-4 # 5e-4
weight_decay: 1e-5
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.5

d_model: 64
mixer_model_config:
  input_dim: 1
  dropout_prob: 0.1
  d_model: 64
  n_layer: 2             
  d_intermediate: 128       # 通常为 d_model 的 4 倍，设置为 0 可禁用 MLP
  attn_layer_idx: [0, 1]
  ssm_cfg:
      layer: Mamba2Rotary   # 必须存在，用于选择使用 Mamba1
      d_conv: 4
      rotary_emb_scale_base: 512
      rotary_emb_center_mode: dynamic

  attn_cfg:
    layer: MHATime
    num_heads: 4
    rotary_emb_dim: 8   # 一般为 d_model // num_heads // 2
    rotary_emb_scale_base: 2048
    rotary_emb_center_mode: dynamic
    # rotary_emb_time_center: 666
    causal: true

  norm_epsilon: 1e-5
  rms_norm: false            # 是否使用 RMSNorm 替代 LayerNorm

  initializer_cfg:
    initializer_range: 0.02  # 初始权重方差，保持默认即可

  fused_add_norm: false      # 是否使用 Triton 融合Norm（需支持）

  residual_in_fp32: true     # 更稳定的残差精度

# MLP 参数
mlp_out: 1
mlp_dropout: 0.3
mlp_hdw: [128]

# 其他参数
dim: 1
epochs: 150
save_dir: null
cuda_id: "0"

# 数据与控制参数
dataset:  ChinaArray
seed: 0
Mc: 3 # 4.5
Mf: 6
Twindow: 200
Tfore: 20
dt: 10
context_len: 1
split_by_time: true
use_sampler: true # true
time_order:  [train, val, test]
features_input_keys : ['mag'] #  'log_inter_times'
normalize_time_by_token: tau_unfiltered