model: etas
num_event_types: 1
pad_token_id: 1
task_type: tpp
# 训练参数


fix_mu: false
# fixed_mu_value: 0
richter_b: null


base_rate_init: 0.26

batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-2 # 5e-4
weight_decay: 5e-3
loss_reduction: per_time
# etas_query_chunk_size: 4096
# etas_history_chunk_size: 9192
etas_grad_checkpoint: false

scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type:  step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8
# 


# 其他参数
dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"


# 数据与控制参数
dataset: ChuanDian
seed: 0
minibatch_training: false
split_by_time: true
time_order:  [train, val, test]
