model: etas
num_event_types: 1
pad_token_id: 1
task_type: tpp

bg_model: kernel_mamba
bg_model_cfg:
  d_feature: 1
  d_state: 64
  d_model: 16
  model_type: mamba
  scale_init: 1000.0
  smooth_kernel_size: 3

  kernel_types: [gamma, exp, powerlaw]
  kernel_size: 64
  dt: 1.0
  normalize_kernel: true
  gate_type: softmax
  gate_temperature: 1.0

  kernel_init_weight: 0.2
  kernel_activation: identity
  residual_init_weight: 0.8
  residual_activation: identity
  residual_penalty_weight: 1.0
  gate_smooth_weight: 0.001
  gate_entropy_weight: 0.0

  gamma_init_k: 3.0
  gamma_init_beta: 0.3
  exp_init_tau: 10.0
  powerlaw_init_alpha: 1.5
  powerlaw_init_tau: 10.0

bg_learning_rate: 5e-4

fix_mu: true
fixed_mu_value: 0
richter_b: null

base_rate_init: 0.26

batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-2
weight_decay: 5e-3
loss_reduction: per_event
loss_weights:
  bg_kl_weight: 0.05
  bg_norm_weight: 0.2
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8

etas_enforce_subcritical: false
etas_enforce_p_gt_one: true

dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"

dataset: CB_HAB1a
seed: 0
minibatch_training: false
split_by_time: true
time_order: [train, val, test]

catalog_cfg:
  freq: "1D"
  mag_completeness: -0.4
