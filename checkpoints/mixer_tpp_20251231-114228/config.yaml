# resume_path: ./checkpoints/mixer_tpp_20250821-223034/best_model_1.pth
# load_specific_parts: ['encoder']
# freeze_parts: ['encoder']
# exclude_freeze_parts: ['input_linear']

model: mixer_tpp
num_event_types: 1
pad_token_id: 1
task_type: tpp


batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3 # 5e-4
weight_decay: 1e-2
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type:  step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8


dropout: 0.3
d_model: 64
mixer_model_config:
  input_dim: 1
  dropout_prob: 0.1
  d_model: 64
  n_layer: 2    
  d_intermediate: 128   # Typically set to 2 times d_model, adjust as needed
  attn_layer_idx: [1]
  ssm_cfg:
      layer: Mamba2Rotary  
      # d_conv: 4
      use_conv: false
      rotary_emb_scale_base: 1024


  attn_cfg:
    layer: MHATime
    num_heads: 4
    rotary_emb_dim: 8   # Typically set to d_model // num_heads // 2
    rotary_emb_scale_base: 1024
    causal: true

  norm_epsilon: 1e-5
  rms_norm: true             # Use RMSNorm instead of LayerNorm

  initializer_cfg:
    initializer_range: 0.02  # Initial weight variance, keep default

  fused_add_norm: true       # Enable Triton fused normalization (requires support)

  residual_in_fp32: true     


# 
num_components: 32


dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"


dataset:  PNR_1z
seed: 0
minibatch_training: false
split_by_time: true
time_order:  [train, val, test]
features_input_keys : ['mag']  # 
normalize_time_by_token: true
time_scale_base_key: tau_mean
predict_b:  false
use_ssm_filter: false
B_range: [1e-4, 1e-2]

use_b_updater: false
use_adaptive_loss_weights: false

b_updater_cfg:
  delta: 0.98
  a0: 20
  init_b_target: 1

loss_weights:
  time_weight: 1
  mag_weight: 1
  b_weight: 0.01

loss_reduction: 'per_time'
b_range: [0.2,2]

catalog_cfg:
  freq: "1D"
  mag_completeness: -1.5
