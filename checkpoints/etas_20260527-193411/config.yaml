model: etas
num_event_types: 1
pad_token_id: 1
task_type: tpp

# 训练参数（尽可能对齐 20260421-213853）
bg_model: mamba
bg_model_cfg:
 d_feature: 1
 d_state: 64
 d_model: 16
 model_type: mamba
 scale_init: 1000.0
 smooth_kernel_size: 3

bg_learning_rate: 5e-4

fix_mu: true
fixed_mu_value: 0
richter_b: null
base_rate_init: 0.26

batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-2
weight_decay: 5e-3
loss_reduction: per_event
loss_weights:
  bg_kl_weight: 0
  bg_norm_weight: 0.2

scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8

# 与 33aa6ccd/20260421 更接近的显式控制
# use_double_precision: true
etas_enforce_subcritical: false
etas_enforce_p_gt_one: false
etas_bg_norm_axis: full
etas_query_chunk_size: 0
etas_history_chunk_size: 0
etas_grad_checkpoint: false

# 其他参数
dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"

# 数据与控制参数
dataset: CB_HAB1a
seed: 0
minibatch_training: false
split_by_time: true
time_order: [train, val, test]

catalog_cfg:
  freq: "1D"
  mag_completeness: -0.4
