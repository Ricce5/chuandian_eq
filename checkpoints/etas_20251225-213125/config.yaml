#  d_feature: 1 
#  scale_init: 100.0
#  no_weight_decay: true


bg_learning_rate: 5e-4

# fix_mu_zero: true

base_rate_init: 0.26

batch_size: 1
optimizer_type: lbfgs
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3 # 5e-4
weight_decay: 1e-2
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type:  step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8
# 


# 其他参数
dim: 1
epochs: 2000
save_dir: null
cuda_id: "0"


# 数据与控制参数
dataset: PNR_1z
seed: 0
minibatch_training: false
split_by_time: true
time_order:  [train, val, test]


catalog_cfg:
  freq: 1D
  mag_completeness: -1.5