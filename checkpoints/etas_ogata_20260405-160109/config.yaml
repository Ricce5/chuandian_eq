model: etas_ogata
num_event_types: 1
pad_token_id: 1
task_type: tpp

# Ogata ETAS productivity kernel:
# g = K * exp(alpha_e*(M-Mc)) * (p-1)*c^(p-1) * (t+c)^(-p)

# Optional background model
# bg_model: proportional
# bg_model_cfg:
#  d_feature: 1
#  scale_init: 500.0

bg_learning_rate: 5e-4

fix_mu: false
# fixed_mu_value: 0
richter_b: null

base_rate_init: 0.26
productivity_K_init: 0.11
productivity_alpha_e_init: 2.302585092994046  # ln(10)
mag_max: 10.0

batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3
weight_decay: 5e-3
loss_reduction: per_event
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8

# Other parameters
dim: 1
epochs: 1500
save_dir: null
cuda_id: "0"

# Data and control parameters
dataset: ChuanDian
seed: 0
minibatch_training: false
split_by_time: true
time_order: [train, val, test]
