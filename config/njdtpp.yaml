model: njdtpp
num_event_types: 1
pad_token_id: 1
task_type: tpp

batch_size: 8
max_seq_len: 512
mean_nll_events: 300
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3
weight_decay: 1e-5
loss_reduction: per_event
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: none
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8

njdtpp_dim_eta: 4
njdtpp_dim_hidden: 16
njdtpp_num_hidden: 2
njdtpp_sigma: 0.01
njdtpp_num_divide: 2
njdtpp_euler_eps: 1e-8
njdtpp_log_intensity_clip: 20.0
njdtpp_mark_b_floor: 1e-3
njdtpp_sample_step: 0.1
njdtpp_sample_max_events: 1024
njdtpp_sample_intensity_floor: 1e-6
njdtpp_sample_init_noise_scale: 0.0

dim: 1
epochs: 500
save_dir: null
cuda_id: "0"

dataset: ChuanDian
seed: 0
minibatch_training: true
split_by_time: true
time_order: [train, val, test]
