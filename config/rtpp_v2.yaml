# Model settings
model: rtpp_v2
num_event_types: 1
pad_token_id: 1
task_type: tpp

# Training parameters
batch_size: 1
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3
weight_decay: 1e-2
loss_reduction: per_event
loss_weights:
  time_weight: 1.0
  mag_weight: 1.0
  b_weight: 0.0
  b_smooth_weight: 0.0
  bg_norm_weight: 0.2
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: hf_cosine
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.8



bg_model: mamba
bg_model_cfg:
 d_feature: 1 
 d_state: 64
 d_model: 16
 model_type: mamba  # mamba | mamba2
 scale_init: 1000.0
 smooth_kernel_size: 3



rnn_type: GRU
d_model: 64
rnn_dropout: 0.2
rnn_use_residual: true
rnn_use_layernorm: true
scale_range: positive
num_components: 32

# Time preprocessing for RNN input
# - legacy: log(tau) - log(tau_mean)
# - oracle: (log10(tau) - log_tau_mean) / log_tau_std
rtpp_time_preprocess: oracle
rtpp_log_tau_std: 2.0
rtpp_inter_time_min: 1e-10
rtpp_inter_time_max: 1e10

# Time-head network
hypernet_time_use_mlp: true
hypernet_time_hidden_dim: 64
hypernet_time_activation: silu
hypernet_time_mlp_dropout: 0.0

# Time head parametrization for rtpp_v2:
# - legacy: same behavior as original RTPP Weibull-mixture headzm
# - oracle: Oracle-style log-mean parametrization
rtpp_time_parametrization: oracle
rtpp_normalize_mixture_logits: true

# Magnitude / b-value settings
predict_b: true
b_use_bg_context: false
time_use_bg_context: true
b_init: 1.0
b_range: [0.5, 2.0]
use_b_updater: true
use_adaptive_loss_weights: false

# b-updater config (used when use_b_updater=true)
b_updater_cfg:
  delta: 0.99
  a0: 20
  init_b_target: 1.0

# Other parameters
dim: 1
epochs: 1000
save_dir: null
cuda_id: "0"

# Data and control parameters
dataset: Geysers
seed: 0
minibatch_training: false
split_by_time: true
time_order:  [train, val, test]


catalog_cfg:
  freq: "1D"
  mag_completeness: 2.2
