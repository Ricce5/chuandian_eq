model: clf_mixer_attnpl_t
base_config: config/clf_mixer_attnpl_t.yaml

seeds: [0, 1, 2,3,4,5]

twindow: 180
dt: 10
context_len: 1

apply_ref_profile: false
clear_criterion_for_unmapped_tf: true
grid:
  name_prefix: tf90
  common:
    Tfore: 90
    Mf: 5.5
    use_sampler: true
    criterion_alpha: 0.5
    overrides:
      batch_size: 64
      max_grad_norm: 1.0
  points:

    - name: baseline


    - name: a050_align_scedcmb64_seed8cfg
      overrides:
        learning_rate: 0.0015
        weight_decay: 0.0001
        warmup_ratio: 0.15
        scheduler_type: warmup_linear_decay
        max_grad_norm: 3.0
    
    - name: a050_align_scedcmb64_seed8cfg_maxgrad1
      overrides:
        learning_rate: 0.0015
        weight_decay: 0.0001
        warmup_ratio: 0.15
        scheduler_type: warmup_linear_decay
        max_grad_norm: 1.0

    - name: a050_align_scedcmb64_seed8cfg_maxgrad2
      overrides:
        learning_rate: 0.0015
        weight_decay: 0.0001
        warmup_ratio: 0.15
        scheduler_type: warmup_linear_decay
        max_grad_norm: 2.0

    - name: a050_lr1e3_wd1e4_wld
      overrides:
        learning_rate: 0.001
        weight_decay: 0.0001
        warmup_ratio: 0.15
        scheduler_type: warmup_linear_decay


    - name: a075_lr1e3_wd1e3_step
      criterion_alpha: 0.75
      overrides:
        learning_rate: 0.001
        weight_decay: 0.001
        warmup_ratio: 0.10
        scheduler_type: step_warmup

gpu_ids: [0]
max_parallel: 6
jobs_per_gpu: 6
stop_on_error: false

exp_root: experiments
exp_name: clf_grid_tf_90_stability_grid_v2


run_test: true
ckpt_select: best
