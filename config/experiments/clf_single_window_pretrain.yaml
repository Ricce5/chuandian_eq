model: clf_mixer_attnpl_t
base_config: config/clf_mixer_attnpl_t.yaml

# 单窗口：固定 Tfore/Mf，不再做窗口网格
# 对比项：4个预训练来源 + 1个不迁移（scratch）
tfs: [90]
mfs: [5.5]
seeds: [0, 1, 2, 3, 4]
pair_mode: true

twindow: 180
dt: 10
context_len: 1

gpu_ids: [0]
max_parallel: 6
jobs_per_gpu: 6
stop_on_error: false

exp_root: experiments
exp_name: clf_single_window_pretrain_b64_lr3e3

run_test: true
ckpt_select: best
resume_exp: true
skip_done: true

grid:
  name_prefix: tf90
  common:
    Tfore: 90
    Mf: 5.5
  points:
    # 0) 不迁移（对应 experiments/clf_scratch）
    - name: scratch
      overrides:
        resume_path: null
        load_specific_parts: null
        encoder_param_keywords: null
        criterion_cfg.alpha: 0.75
        criterion_cfg.gamma: 2.0
        use_sampler: true

    # 1) 迁移自 AZDX（对应 experiments/clf_AZDX）
    - name: pre_azdx
      overrides:
        resume_path: ./checkpoints/mixer_tpp_20260508-182744/last_model_1.pth
        load_specific_parts: [encoder]
        encoder_param_keywords: [encoder]
        criterion_cfg.alpha: 0.75
        criterion_cfg.gamma: 2.0
        use_sampler: true

    # 2) 迁移自 AZDX_minus_b（对应 experiments/clf_AZDX_minus_b）
    - name: pre_azdx_minus_b
      overrides:
        resume_path: ./checkpoints/mixer_tpp_20260510-211348/last_model_1.pth
        load_specific_parts: [encoder]
        encoder_param_keywords: [encoder]
        criterion_cfg.alpha: 0.75
        criterion_cfg.gamma: 2.0
        use_sampler: true

    # 3) 迁移自 SCEDC（对应 experiments/clf_SCEDC）
    - name: pre_scedc
      overrides:
        resume_path: ./checkpoints/mixer_tpp_20260514-211059/last_model_1.pth
        load_specific_parts: [encoder]
        encoder_param_keywords: [encoder]
        criterion_cfg.alpha: 0.75
        criterion_cfg.gamma: 2.0
        use_sampler: true

    # 4) 迁移自 SCEDC_minus_b（对应 experiments/clf_SCEDC_minus_b）
    - name: pre_scedc_minus_b
      overrides:
        resume_path: ./checkpoints/mixer_tpp_20260514-211318/last_model_1.pth
        load_specific_parts: [encoder]
        encoder_param_keywords: [encoder]
        criterion_cfg.alpha: 0.75
        criterion_cfg.gamma: 2.0
        use_sampler: true
