model: rtpp_v2
base_config: config/rtpp_v2.yaml

# 多数据集复现实验：
# - 数据集与 catalog_cfg 参考 experiment_record.md 的 TPP/forecast 记录。
# - 每个 grid point 对应一个数据集；种子在每个数据集下展开。
seeds: [0,1, 2]

# 并发与资源
gpu_ids: [0]
max_parallel: 3
jobs_per_gpu: 3
stop_on_error: false

exp_root: experiments
exp_name: rtpp_v2_multi_dataset_norm_0.2

run_test: true
ckpt_select: both
resume_exp: true
skip_done: true

grid:
  name_prefix: rtpp_v2
  common:
    overrides:
      minibatch_training: false
      split_by_time: true
      time_order: [train, val, test]
  points:


    # experiment_record.md 4.6: PNR_1z
    - name: PNR_1z
      overrides:
        dataset: PNR_1z
        catalog_cfg:
          freq: "1D"
          mag_completeness: -1.5

    # experiment_record.md 4.6: CB_HAB1a(-0.4)
    - name: CB_HAB1a
      overrides:
        dataset: CB_HAB1a
        catalog_cfg:
          freq: "1D"
          mag_completeness: -0.4

    # experiment_record.md 4.6: CB_HAB4
    - name: CB_HAB4
      overrides:
        dataset: CB_HAB4
        catalog_cfg:
          freq: "1D"
          mag_completeness: 0.9

    # experiment_record.md 4.6 / config/data_tpp.yaml: St1-2018(-0.5)
    - name: St1_2018
      overrides:
        dataset: St1-2018
        catalog_cfg:
          freq: "1D"
          mag_completeness: -0.5
