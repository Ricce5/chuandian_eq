model: lstm
base_config: config/lstm.yaml

seeds: [0, 2,3,4,7,8]

# 全局默认参数（可被 grid.points 内同名键覆盖）
twindow: 360
dt: 10
context_len: 0

# 可选：全局损失函数（可被 grid.points 内同名键覆盖）
criterion_name: smooth_l1
criterion_beta: 0.6

gpu_ids: [0]
max_parallel: 3
jobs_per_gpu: 3
stop_on_error: false

exp_root: experiments
exp_name: lstm_5_seeds_v6

run_test: true
ckpt_select: last
resume_exp: true
skip_done: true

grid:
  name_prefix: lstm_
  points:
    - name: base
      Tfore: 180
      Mf: 3

    # B: v4 已验证有效方向：加 EMA（提升 last 均值）
    - name: top_h64_l2_bs128_step_wd1e2
      Tfore: 180
      Mf: 3
      overrides:
        scheduler_type: step_warmup
        learning_rate: 0.001
        weight_decay: 0.01
        warmup_ratio: 0.1
        step_lr_step_size_ratio: 0.2
        step_lr_gamma: 0.5
        batch_size: 128
        accumulation_steps: 1
        epochs: 300
        use_ema: true
        ema_decay: 0.98
        lstm_hidden_size: 64
        lstm_num_layers: 2
        lstm_dropout: 0.3
        criterion_cfg.beta: 0.6

    # C: v4 已验证有效方向：加正则（提升稳定性）
    - name: top_h64_l2_bs128
      Tfore: 180
      Mf: 3
      overrides:
        scheduler_type: step_warmup
        learning_rate: 0.001
        weight_decay: 0.02
        warmup_ratio: 0.1
        step_lr_step_size_ratio: 0.2
        step_lr_gamma: 0.5
        batch_size: 128
        accumulation_steps: 1
        epochs: 300
        use_ema: false
        lstm_hidden_size: 64
        lstm_num_layers: 2
        lstm_dropout: 0.3
        criterion_cfg.beta: 0.6

