    overrides:
      scheduler_type: step_warmup
      warmup_ratio: 0.1
      step_lr_step_size_ratio: 0.15
      step_lr_gamma: 0.4
      learning_rate: 0.00061
      weight_decay: 0.0015
      encoder_learning_rate: 0.0004
      batch_size: 128
      criterion_cfg.beta: 0.3
      mlp_dropout: 0.2

  - name: inter9_r06_base_t07_step_dup
