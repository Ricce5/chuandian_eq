# 并发与资源
gpu_ids: [0]
max_parallel: 2
jobs_per_gpu: 2
stop_on_error: false

# 输出目录
exp_root: experiments
exp_name: reg_mixer_attnpl_grid_inter9_excl2_round

# 可选：训练后自动测试
run_test: true
ckpt_select: best,last
