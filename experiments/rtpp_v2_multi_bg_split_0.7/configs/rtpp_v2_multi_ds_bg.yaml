          val_start_ts: "2018-12-10T10:05:54"
          test_start_ts: "2018-12-13T11:39:51"
        bg_model: mamba
        bg_model_cfg:
          d_feature: 1
          d_state: 64
          d_model: 16
          model_type: mamba  # mamba | mamba2
          scale_init: 1000.0
          smooth_kernel_size: 3
        loss_weights:
          bg_kl_weight: 0
          bg_norm_weight: 0

    - name: PNR_1z_kernel_norm_0
      overrides:
