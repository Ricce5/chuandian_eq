        catalog_cfg:
          freq: "1D"
          mag_completeness: -1.5
          train_start_ts: "2018-10-15T08:00:00"
          val_start_ts: "2018-12-10T10:05:54"
          test_start_ts: "2018-12-13T11:39:51"
        bg_model: kernel
        bg_model_cfg:
          d_feature: 1
          scale_init: 300.0
          kernel_type: gamma
          kernel_size: 14400
          normalize_kernel: true
          use_mlp: true
          hidden: 32
          gamma_init_k: 4.0
