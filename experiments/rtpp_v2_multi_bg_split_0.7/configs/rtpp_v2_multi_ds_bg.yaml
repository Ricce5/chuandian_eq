model: rtpp_v2
base_config: config/rtpp_v2.yaml

# 多数据集复现实验：
# - 数据集与 catalog_cfg 参考 experiment_record.md 的 TPP/forecast 记录。
# - 每个 grid point 对应一个数据集；种子在每个数据集下展开。
seeds: [0,1, 2]

# 并发与资源
gpu_ids: [1]
max_parallel: 3
jobs_per_gpu: 3
stop_on_error: false

exp_root: experiments
exp_name: rtpp_v2_multi_bg_split_0.7

run_test: true
ckpt_select: best
resume_exp: true
skip_done: true

grid:
  name_prefix: rtpp_v2_bg
  common:
    overrides:
      minibatch_training: false
      split_by_time: true
      time_order: [train, val, test]
  points:


    # experiment_record.md 4.6: PNR_1z
    - name: PNR_1z_no_bg
      overrides:
        dataset: PNR_1z
        catalog_cfg:
          freq: "1D"
          mag_completeness: -1.5
          train_start_ts: "2018-10-15T08:00:00"
          val_start_ts: "2018-12-10T10:05:54"
          test_start_ts: "2018-12-13T11:39:51"
        bg_model: null
        time_use_bg_context: false
        b_use_bg_context: false

    - name: PNR_1z_proportional_norm_0
      overrides:
        dataset: PNR_1z
        catalog_cfg:
          freq: "1D"
          mag_completeness: -1.5
          train_start_ts: "2018-10-15T08:00:00"
          val_start_ts: "2018-12-10T10:05:54"
          test_start_ts: "2018-12-13T11:39:51"
        bg_model: proportional
        bg_model_cfg:
          d_feature: 1
          scale_init: 500.0
        loss_weights:
          bg_kl_weight: 0
          bg_norm_weight: 0

    - name: PNR_1z_mamba_norm_0
      overrides:
        dataset: PNR_1z
        catalog_cfg:
          freq: "1D"
          mag_completeness: -1.5
