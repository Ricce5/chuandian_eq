# resume_path: /root/autodl-tmp/chuandian_eq/checkpoints/lstm_20250624-104548/last_model_1.pth
model: lstm
task_type: regression



use_ema: false
batch_size: 64
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 1e-3 # 5e-4
weight_decay: 1e-2
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.5


lstm_hidden_size: 192
lstm_num_layers: 3
lstm_dropout: 0.2
output_activation: sigmoid  # 可选: null | sigmoid | tanh | relu

epochs: 300
save_dir: null
cuda_id: "0"



dataset: ChuanDian
criterion_name: smooth_l1
criterion_cfg:
   beta: 0.1
seed: 0
Mc: 3 # 4.5
Mf: 3
mag_min: 3.0
mag_max: 9.0
Mag_elaps: [5.5, 6, 6.5, 7]
t_elaps_mode: global
telaps_nan_strategy: high_sentinel  # high_sentinel (recommended) | zero (legacy)
Twindow: 360
Tfore: 180   # 100
dt: 10
context_len: 0
dMag: 0.1
split_by_time: true
lstm_feature_mode: external_sliding  # inner_sliding | external_sliding
time_step: 5
feature_cols: ['Num', 'Mag_max', 'Mag_mean', 'b_lsq', 'a_lsq',
       'b_std_lsq', 'std_gr_lsq', 'b_mlk', 'a_mlk', 'b_std_mlk', 'std_gr_mlk',
       'dM_lsq', 'dM_mlk', 'Energy_sqrt', 'prob_x7_lsq', 'prob_x7_mlk',
       'beta','zvalue' ]

# Optuna 调参（仅模型/训练参数，不改数据相关参数）
optuna:
  objective: lstm_dtw_rmse
  default_profile: global
  n_trials: 20
  epochs: 120
  sampler: tpe
  sampler_seed: 0
  trial_seed_base: 1000
  report_top_k: 5
  storage: optuna/lstm_dtw_rmse.db
  metric_weights:
    RMSE: 1.0
    DTW: 1.0
  profiles:
    global:
      t_elaps_mode: global
      params:
        batch_size:
          type: categorical
          choices: [32, 64, 96, 128]
        learning_rate:
          type: float
          low: 1e-4
          high: 3e-3
          log: true
        weight_decay:
          type: float
          low: 1e-6
          high: 1e-2
          log: true
        warmup_ratio:
          type: float
          low: 0.02
          high: 0.2
          step: 0.02
        scheduler_type:
          type: categorical
          choices: [step_warmup, hf_cosine, warmup_linear_decay]
        step_lr_step_size_ratio:
          type: float
          low: 0.1
          high: 0.5
          step: 0.05
        step_lr_gamma:
          type: float
          low: 0.3
          high: 0.9
          step: 0.1
        scheduler_min_lr:
          type: float
          low: 1e-7
          high: 1e-5
          log: true
        lstm_hidden_size:
          type: categorical
          choices: [128, 160, 192, 256, 320]
        lstm_num_layers:
          type: int
          low: 1
          high: 4
        lstm_dropout:
          type: float
          low: 0.0
          high: 0.4
          step: 0.05
        criterion_cfg.beta:
          type: categorical
          choices: [0.05, 0.1, 0.2, 0.3]

    window:
      t_elaps_mode: window
      params:
        batch_size:
          type: categorical
          choices: [32, 64, 128]
        learning_rate:
          type: float
          low: 8e-5
          high: 2e-3
          log: true
        weight_decay:
          type: float
          low: 1e-7
          high: 8e-3
          log: true
        warmup_ratio:
          type: float
          low: 0.02
          high: 0.2
          step: 0.02
        scheduler_type:
          type: categorical
          choices: [step_warmup, hf_cosine, warmup_linear_decay]
        step_lr_step_size_ratio:
          type: float
          low: 0.1
          high: 0.5
          step: 0.05
        step_lr_gamma:
          type: float
          low: 0.3
          high: 0.9
          step: 0.1
        scheduler_min_lr:
          type: float
          low: 1e-7
          high: 1e-5
          log: true
        lstm_hidden_size:
          type: categorical
          choices: [128, 256]
        lstm_num_layers:
          type: int
          low: 2
          high: 4
        lstm_dropout:
          type: float
          low: 0.0
          high: 0.5
          step: 0.05
        criterion_cfg.beta:
          type: categorical
          choices: [0.05, 0.1, 0.2, 0.3]
