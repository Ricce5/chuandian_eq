model: reg_mixer_attnpl_t
base_config: config/reg_mixer_attnpl_t.yaml

seeds: [0, 1, 2]

gpu_ids: [0]
max_parallel: 6
jobs_per_gpu: 6
stop_on_error: false

exp_root: experiments
exp_name: reg_mixer_attnpl_ablation

run_test: true
ckpt_select: both
resume_exp: true
skip_done: true

grid:
  name_prefix: reg_ab
  points:
    - name: reg
     

    - name: log_pretrain
      load_strategy: none
      overrides:
        mixer_model_config.input_dim: 2
        features_input_keys: [mag, log_inter_times]

    - name: minus_txpos
     
      overrides:
        mixer_model_config.ssm_cfg:
          layer: Mamba2
          d_conv: 4
        mixer_model_config.attn_cfg.layer: MHA

    - name: minus_tmap
     
      overrides:
        extractor_name: last
        extractor_cfg: {}

    - name: minus_pretrain
      load_strategy: none
      overrides:
        resume_path: null
        load_specific_parts: null
        encoder_param_keywords: null
        encoder_learning_rate: null
