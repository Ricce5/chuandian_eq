model: lstm
base_config: config/lstm.yaml

# 推荐：pair_mode=true 时，tfs 和 mfs 一一对应
pair_mode: false
tfs: [180]
mfs: [3]
seeds: [0, 1, 2]

# 数据窗口参数
twindow: 360
dt: 10
context_len: 0

# 可选：统一覆盖损失函数配置
criterion_name: smooth_l1
criterion_beta: 0.2

# 并发与资源
gpu_ids: [0]
max_parallel: 3
jobs_per_gpu: 3
stop_on_error: false

# 输出目录
exp_root: experiments
exp_name: lstm_seed

# 可选：训练后自动测试
run_test: true
ckpt_select: both

# 可选：只生成配置不训练
# skip_train: true

# 额外覆盖（dotted key）
# set:
#   lstm_hidden_size: 256
#   lstm_num_layers: 4
#   lstm_dropout: 0.3
#   learning_rate: 0.001
