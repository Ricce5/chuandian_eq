seed: 0
Mc: 3
Mf: 3
mag_min: 3.0
mag_max: 9.0
Mag_elaps:
- 5.5
- 6
- 6.5
- 7
t_elaps_mode: global
telaps_nan_strategy: high_sentinel
Twindow: 360
Tfore: 180
dt: 10
context_len: 0
dMag: 0.1
split_by_time: true
lstm_feature_mode: external_sliding
time_step: 5
feature_cols:
- Num
- Mag_max
- Mag_mean
- b_lsq
- a_lsq
- b_std_lsq
- std_gr_lsq
- b_mlk
