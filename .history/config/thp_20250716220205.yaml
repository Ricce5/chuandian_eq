num_components: 32

# 其他参数
dim: 1
epochs: 150
save_dir: null
cuda_id: "0"

# 数据与控制参数
Mc: 3 # 4.5
Twindow: 200
dt: 10
split_by_time: true
use_sampler: true # true
time_order:  [train, val, test]
