# 模型设置
# resume_path: /root/autodl-tmp/chuandian_eq/checkpoints/classifier_20250629-170840/last_model_1.pth
model: classifier
dataset: AZDX
# 训练参数

batch_size: 256
accumulation_steps: 1
warmup_ratio: 0.1
learning_rate: 5e-4 # 5e-4
weight_decay: 1e-5
scheduler_factor: null
scheduler_patience: null
scheduler_threshold: null
scheduler_min_lr: 1e-6
scheduler_type: step_warmup
step_lr_step_size_ratio: 0.2
step_lr_gamma: 0.5

# transfomer结构参数
