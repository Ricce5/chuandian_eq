mlp_hdw: [256, 128, 64]

# 其他参数
dim: 3
epochs: 300
save_dir: null
cuda_id: "0"

# 数据与控制参数
seed: 0
Mc: 4.5 # 4.5
Mf: 5.5
Twindow: 20
Tfore: 2
dt: 10
context_len: 1
split_by_time: true
use_sampler: true # true
time_order:  [train, val, test]